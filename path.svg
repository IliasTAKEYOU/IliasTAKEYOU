<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" role="img" aria-label="Parcours" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#64FFDA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="70">
        <animate attributeName="width" from="0" to="900" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#reveal)">
    <text x="34" y="44" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="34" font-weight="700" fill="#64FFDA" opacity="0.45" filter="url(#glow)">Parcours</text>
    <text x="34" y="44" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="34" font-weight="700" fill="url(#g)">Parcours</text>
    <rect x="34" y="56" width="420" height="3" rx="1.5" fill="url(#g)"/>
  </g>
  <rect x="6" y="14" width="10" height="34" rx="2" fill="#64FFDA">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
